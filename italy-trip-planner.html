<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Trip Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f3ef;
        color: #242424;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 20px 60px;
    }

    header {
        text-align: center;
        margin-bottom: 35px;
    }

    header .flag {
        font-size: 42px;
    }

    h1 {
        margin: 8px 0;
        font-size: clamp(32px, 6vw, 52px);
    }

    header p {
        color: #666;
        font-size: 17px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    h2 {
        margin-top: 0;
        font-size: 21px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .route-stays {
        display: grid;
        gap: 10px;
        margin-bottom: 16px;
    }

    .route-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
    }

    .route-controls .field {
        display: flex;
        flex: 0 1 auto;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .route-controls select {
        width: auto;
        min-width: 104px;
        margin-top: 0;
    }

    .reset-route {
        flex: none;
        margin: 0;
        white-space: nowrap;
    }

    .route-stay {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fff;
    }

    .route-stay-info {
        display: grid;
        gap: 3px;
    }

    .route-stay-recommendation {
        color: #777;
        font-size: 13px;
    }

    .stay-control {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
    }

    .stay-control select {
        width: auto;
        min-width: 112px;
        margin-top: 0;
    }

    .route-stay-actions {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .destination-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
    }

    .add-destination {
        padding: 10px 14px;
        border-radius: 8px;
        background: #147a4b;
        color: #fff;
        font-weight: 700;
    }

    .add-destination:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }

    .remove-city {
        display: inline-flex;
        width: 36px;
        height: 36px;
        flex: none;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        color: #666;
        font-size: 22px;
        line-height: 1;
        text-align: center;
    }

    .remove-city:hover {
        border-color: #b94a48;
        color: #a33;
    }

    .remove-city:focus-visible {
        outline: 2px solid #147a4b;
        outline-offset: 2px;
    }

    .route-slots {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .route-slot {
        display: flex;
        min-width: 0;
        min-height: 76px;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 12px 14px;
        border: 1px dashed #c8cec9;
        border-radius: 10px;
        background: #fafaf8;
    }

    .route-travel {
        display: flex;
        min-height: 32px;
        align-items: center;
        margin-left: 20px;
        padding-left: 12px;
        border-left: 1px solid #c8cec9;
        color: #666;
        font-size: 12px;
    }

    .route-slot-day {
        color: #777;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .route-slot strong {
        font-size: 15px;
    }

    .route-slot-empty strong {
        color: #929894;
        font-weight: 500;
    }

    label.field {
        display: block;
        font-weight: 600;
    }

    select {
        width: 100%;
        margin-top: 8px;
        padding: 13px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background: white;
    }

    .city-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
    }

    .destination-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 1fr);
        gap: 18px;
        align-items: start;
    }

    #city-map {
        height: 360px;
        border-radius: 12px;
        z-index: 0;
    }

    .map-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 8px;
        color: #666;
        font-size: 12px;
    }

    .map-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .map-legend i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .map-legend .selected-marker {
        background: #147a4b;
    }

    .map-legend .recommended-marker {
        background: #d97706;
    }

    .recommended-edge-icon {
        border: 0;
        background: transparent;
    }

    .recommended-edge-label {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 120px;
        min-height: 26px;
        padding: 3px 7px;
        border: 1px solid #d97706;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        color: #74400a;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    .recommended-edge-arrow {
        flex: none;
        color: #d97706;
        font-size: 16px;
        line-height: 1;
    }

    .recommended-edge-name {
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .city-details {
        margin-top: 12px;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafaf8;
    }

    .city-details h3 {
        margin: 0 0 6px;
        font-size: 18px;
    }

    .city-details p {
        margin: 0 0 10px;
        color: #666;
        font-size: 14px;
    }

    .city-details h4 {
        margin: 0 0 5px;
        font-size: 14px;
    }

    .city-details ul {
        margin: 0;
        padding-left: 20px;
        color: #444;
        font-size: 14px;
    }

    .city-option {
        position: relative;
    }

    .city-option input {
        position: absolute;
        opacity: 0;
    }

    .city-option label {
        display: block;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        transition: .15s;
        background: #fff;
    }

    .city-option label:hover {
        border-color: #999;
    }

    .city-option input:checked + label {
        border-color: #147a4b;
        background: #eaf6ef;
    }

    .city-name {
        font-weight: 700;
        display: block;
    }

    .city-region {
        display: block;
        margin-top: 4px;
        color: #777;
        font-size: 13px;
    }

    .interest-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .interest {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 100px;
        cursor: pointer;
        background: white;
    }

    .interest:has(input:checked) {
        background: #eaf6ef;
        border-color: #147a4b;
    }

    button {
        border: 0;
        cursor: pointer;
        font: inherit;
    }

    .primary {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        background: #147a4b;
        color: white;
        font-weight: 700;
        font-size: 17px;
        margin-top: 10px;
    }

    .primary:hover {
        background: #0f633d;
    }

    .secondary {
        padding: 8px 12px;
        background: transparent;
        color: #147a4b;
        text-decoration: underline;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .error {
        color: #a33;
        margin-top: 12px;
        font-size: 14px;
    }

    /* Itinerary */

    #itinerary {
        display: none;
    }

    .itinerary-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 20px;
        margin-bottom: 20px;
    }

    .day {
        border: 1px solid #ddd;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 16px;
    }

    .day-header {
        padding: 18px;
        background: #fafafa;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        gap: 15px;
    }

    .day-number {
        color: #147a4b;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .day-title {
        margin: 3px 0 0;
        font-size: 22px;
    }

    .region {
        font-size: 12px;
        background: #eaf6ef;
        padding: 7px 10px;
        border-radius: 20px;
        height: fit-content;
    }

    .day-description {
        padding: 15px 18px 5px;
        color: #666;
    }

    .stop {
        display: flex;
        gap: 14px;
        padding: 15px 18px;
        border-top: 1px solid #eee;
    }

    .stop-number {
        width: 28px;
        height: 28px;
        min-width: 28px;
        border-radius: 50%;
        background: #eaf6ef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #147a4b;
    }

    .stop-content strong {
        display: block;
        margin-bottom: 3px;
    }

    .time {
        color: #888;
        font-size: 13px;
    }

    .travel {
        padding: 10px 18px;
        color: #777;
        background: #fafafa;
        font-size: 13px;
        border-top: 1px dashed #ddd;
    }

    .print-button {
        padding: 10px 15px;
        border: 1px solid #ccc;
        border-radius: 9px;
        background: white;
    }

    .destination-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    }

    #city-map {
        min-height: 360px;
        border-radius: 12px;
    }

@media (max-width: 650px) {
    .destination-layout {
        grid-template-columns: 1fr;
    }
}

    @media (max-width: 650px) {
        .container {
            padding: 22px 14px 40px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .destination-actions {
            align-items: stretch;
            flex-direction: column;
        }

        .route-stay {
            align-items: stretch;
            flex-direction: column;
            gap: 10px;
        }

        .route-controls {
            align-items: center;
            flex-direction: row;
            gap: 8px;
        }

        .route-controls .field {
            min-width: 0;
            gap: 6px;
        }

        .route-controls select {
            min-width: 88px;
        }

        .reset-route {
            padding: 6px 8px;
            font-size: 13px;
        }

    }

    @media (max-width: 360px) {
        .route-controls {
            flex-wrap: wrap;
        }

        .route-controls .field {
            flex: 1 1 100%;
        }

        .stay-control {
            flex: 1;
            justify-content: space-between;
        }

        .stay-control select {
            flex: 1;
        }

        .destination-layout {
            grid-template-columns: 1fr;
        }

        #city-map {
            height: 300px;
        }

        .card {
            padding: 18px;
        }

        .itinerary-header {
            flex-direction: column;
        }
    }

    @media print {
        body {
            background: white;
        }

        .setup,
        header {
            display: none;
        }

        .container {
            max-width: none;
        }

        #itinerary {
            display: block !important;
        }

        .day {
            break-inside: avoid;
        }

        .print-button {
            display: none;
        }
    }
</style>
</head>

<body>

<div class="container">

<header>
    <div class="flag"></div>
    <h1>European Trip Planner</h1>
    <p>Build a personalized itinerary for your European adventure.</p>
</header>

<div class="setup">

    <div class="card">
        <h2>Your route</h2>
        <div class="route-controls">
            <label class="field">
                Number of days
                <select id="days">
                    <option value="2">2 days</option>
                    <option value="3">3 days</option>
                    <option value="4" selected>4 days</option>
                    <option value="5">5 days</option>
                    <option value="6">6 days</option>
                    <option value="7">7 days</option>
                    <option value="8">8 days</option>
                    <option value="9">9 days</option>
                    <option value="10">10 days</option>
                </select>
            </label>
            <button class="secondary reset-route" id="reset-route" type="button">Reset route</button>
        </div>
        <div class="route-stays" id="route-stays"></div>
        <div class="route-slots" id="route-slots" role="list" aria-label="Trip route"></div>
    </div>


    <div class="card">

        <div class="section-header">
            <div>
                <h2 style="margin-bottom:4px;">Where would you like to go?</h2>
                <div style="color:#777;font-size:14px;">
                    Select one city, then add it to your route.
                </div>
            </div>
            <button class="add-destination" id="add-destination" type="button" disabled>
                Add destination
            </button>
        </div>

        <br>

        <div class="destination-layout">
            <div class="city-grid" id="city-list"></div>
            <div>
                <div id="city-map" aria-label="Map of destination cities"></div>
                <div class="map-legend" aria-label="Map marker legend">
                    <span><i class="selected-marker"></i> Selected</span>
                    <span><i class="recommended-marker"></i> Recommended next</span>
                </div>
                <section id="city-details" class="city-details" aria-live="polite">
                    <p>Select a city to see its description and stops.</p>
                </section>
            </div>
        </div>

    </div>


</div>


<div id="itinerary">

    <div class="card">

        <div class="itinerary-header">

            <div>
                <div style="color:#147a4b;font-size:13px;font-weight:bold;">
                    YOUR EUROPEAN ADVENTURE
                </div>

                <h2 id="itinerary-title" style="font-size:30px;margin:5px 0;">
                    Your itinerary
                </h2>

                <div id="itinerary-summary" style="color:#777;"></div>
            </div>

            <button class="print-button" onclick="window.print()">
                🖨️ Print / Save PDF
            </button>

        </div>

        <div id="days-container"></div>

    </div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            "Old Town Graz",
            "Kunsthaus Graz",
            "Murinsel"],
        coordinates: [47.0707, 15.4395],
        recommendedNext: [
            ["Vienna", 2.5],
            ["Ljubljana", 3],
            ["Trieste", 4],
            ["Vienna", 5],
            ["Bled", 3]
        ],
        stayLength: "1-2"
    },

    pisa: {
        name: "Pisa",
        region: "Tuscany",
        description:
            "Famous for its iconic Leaning Tower, Pisa offers a mix of history and culture.",
        stops: [
            "Leaning Tower of Pisa",
            "Piazza dei Miracoli",
            "Pisa Cathedral",
            "Borgo Stretto & lunch"],
        coordinates: [43.7228, 10.4017],
        recommendedNext: [
            ["Florence", 1],
            ["Rome", 2],
            ["Bologna", 2],
            ["Venice", 3]
        ],
        stayLength: "1"
    }

};



/*
Recommended destinations depending on starting point.
*/

const recommendations = {

    trieste: ["venice", "ljubljana", "bled", "verona"],

    venice: ["verona", "bologna", "florence"],

    milan: ["verona", "bologna", "florence"],

    bologna: ["florence", "verona", "venice"],

    florence: ["bologna", "rome", "venice"],

    rome: ["florence", "bologna", "venice"]

};


/*
Create city checkboxes.
*/

const cityList = document.getElementById("city-list");
const cityDetails = document.getElementById("city-details");
const daysSelect = document.getElementById("days");
const routeStays = document.getElementById("route-stays");
const routeSlots = document.getElementById("route-slots");
const addDestinationButton = document.getElementById("add-destination");
const resetRouteButton = document.getElementById("reset-route");
let routeVisits = [];
let citySelectedBeforeActivation = null;
let nextVisitId = 0;
const stayDaysByVisit = {};

function createRouteVisit(cityId) {
    return {
        id: `visit-${nextVisitId++}`,
        cityId
    };
}

function updateAddDestinationButton() {
    const selectedCityId = cityList.querySelector("input:checked")?.value;
    const lastRouteCityId = routeVisits.at(-1)?.cityId;
    addDestinationButton.disabled = !selectedCityId ||
        selectedCityId === lastRouteCityId ||
        routeVisits.length >= Number(daysSelect.value);
    resetRouteButton.disabled = routeVisits.length === 0 && !selectedCityId;
}

function normalizeRouteVisits() {
    let previousCityId = null;
    routeVisits = routeVisits.filter(visit => {
        if (visit.cityId === previousCityId) {
            return false;
        }
        previousCityId = visit.cityId;
        return true;
    });

}

function renderRouteSlots() {
    const numberOfDays = Number(daysSelect.value);
    const route = routeVisits.slice(0, numberOfDays);

    routeStays.replaceChildren();
    routeSlots.replaceChildren();

    let remainingDays = numberOfDays;

    route.forEach(({ id: visitId, cityId }, index) => {
        const city = cities[cityId];
        const recommendedMinimum = Number.parseInt(city.stayLength, 10) || 1;
        const daysReservedForLaterCities = route.length - index - 1;
        const maxStay = Math.max(1, remainingDays - daysReservedForLaterCities);
        const stayDays = Math.min(
            Math.max(1, stayDaysByVisit[visitId] ?? recommendedMinimum),
            maxStay
        );
        stayDaysByVisit[visitId] = stayDays;
        remainingDays -= stayDays;

        const stayRow = document.createElement("div");
        stayRow.className = "route-stay";

        const cityInfo = document.createElement("div");
        cityInfo.className = "route-stay-info";

        const cityName = document.createElement("strong");
        cityName.textContent = city.name;

        const recommendation = document.createElement("span");
        recommendation.className = "route-stay-recommendation";
        const stayUnit = city.stayLength === "1" ? "day" : "days";
        recommendation.textContent = `Recommended stay: ${city.stayLength} ${stayUnit}`;
        cityInfo.append(cityName, recommendation);

        const stayLabel = document.createElement("label");
        stayLabel.className = "stay-control";
        stayLabel.textContent = "Stay";

        const staySelect = document.createElement("select");
        staySelect.setAttribute("aria-label", `Stay length in ${city.name}`);
        for (let days = 1; days <= maxStay; days++) {
            const option = document.createElement("option");
            option.value = String(days);
            option.textContent = `${days} ${days === 1 ? "day" : "days"}`;
            option.selected = days === stayDays;
            staySelect.appendChild(option);
        }
        staySelect.addEventListener("change", () => {
            stayDaysByVisit[visitId] = Number(staySelect.value);
            renderRouteSlots();
        });
        stayLabel.appendChild(staySelect);

        const stayActions = document.createElement("div");
        stayActions.className = "route-stay-actions";

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-city";
        removeButton.textContent = "×";
        removeButton.setAttribute("aria-label", `Remove ${city.name} from route`);
        removeButton.title = `Remove ${city.name} from route`;
        removeButton.addEventListener("click", () => {
            routeVisits = routeVisits.filter(visit => visit.id !== visitId);
            normalizeRouteVisits();
            renderRouteSlots();
            updateCityMap(cityId, true);
        });
        stayActions.appendChild(removeButton);

        stayActions.appendChild(stayLabel);
        stayRow.append(cityInfo, stayActions);
        routeStays.appendChild(stayRow);
    });

    const dayRoute = route.flatMap(({ id: visitId, cityId }) =>
        Array(stayDaysByVisit[visitId]).fill(cityId)
    );

    for (let index = 0; index < numberOfDays; index++) {
        const cityId = dayRoute[index];
        const previousCityId = dayRoute[index - 1];

        if (index > 0 && cityId && previousCityId && cityId !== previousCityId) {
            const travelEntry = (cities[previousCityId].recommendedNext || [])
                .find(([name]) => cityIdForName(name) === cityId);
            const travel = document.createElement("div");
            travel.className = "route-travel";
            travel.setAttribute("role", "note");
            travel.textContent = travelEntry
                ? `Travel time: ${travelEntry[1]} ${travelEntry[1] === 1 ? "hour" : "hours"}`
                : "Travel time: unknown";
            routeSlots.appendChild(travel);
        }

        const slot = document.createElement("div");
        slot.className = cityId ? "route-slot" : "route-slot route-slot-empty";
        slot.setAttribute("role", "listitem");

        const dayLabel = document.createElement("span");
        dayLabel.className = "route-slot-day";
        dayLabel.textContent = `Day ${index + 1}`;

        const destination = document.createElement("strong");
        destination.textContent = cityId
            ? cities[cityId].name
            : "Add a destination or stay day";

        slot.append(dayLabel, destination);
        routeSlots.appendChild(slot);
    }

    updateAddDestinationButton();
    updateRouteLine();
}

daysSelect.addEventListener("change", renderRouteSlots);

const cityMap = L.map("city-map").setView([43.5, 9.5], 4.5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
}).addTo(cityMap);

const routeLinePane = cityMap.createPane("route-line-pane");
routeLinePane.style.zIndex = "350";
routeLinePane.style.pointerEvents = "none";

const routeLineLayer = L.layerGroup().addTo(cityMap);

function updateRouteLine() {
    routeLineLayer.clearLayers();

    const routeCoordinates = routeVisits
        .map(visit => cities[visit.cityId].coordinates);
    if (routeCoordinates.length < 2) {
        return;
    }

    L.polyline(routeCoordinates, {
        color: "#c83737",
        weight: 3,
        opacity: 0.9,
        dashArray: "4 7",
        lineCap: "round",
        pane: "route-line-pane"
    }).addTo(routeLineLayer);
}

const cityMarkers = {};

for (const [id, city] of Object.entries(cities)) {
    cityMarkers[id] = L.circleMarker(city.coordinates, {
        radius: 6,
        color: "#fff",
        weight: 2,
        fillColor: "#858b88",
        fillOpacity: 0.65
    }).addTo(cityMap).bindTooltip(city.name);
}

const recommendedEdgeMarkers = L.layerGroup().addTo(cityMap);
let offscreenRecommendedCityIds = new Set();

const allCityBounds = L.latLngBounds(
    Object.values(cities).map(city => city.coordinates)
).pad(0.1);

cityMap.fitBounds(allCityBounds);

function updateCityDetails(cityId) {
    cityDetails.replaceChildren();

    if (!cityId) {
        const emptyMessage = document.createElement("p");
        emptyMessage.textContent = "Select a city to see its description and stops.";
        cityDetails.appendChild(emptyMessage);
        return;
    }

    const city = cities[cityId];
    const heading = document.createElement("h3");
    heading.textContent = city.name;

    const description = document.createElement("p");
    description.textContent = city.description;

    const stayLength = document.createElement("p");
    const dayUnit = city.stayLength === "1" ? "day" : "days";
    stayLength.textContent = `Suggested stay: ${city.stayLength} ${dayUnit}`;

    const stopsHeading = document.createElement("h4");
    stopsHeading.textContent = "Stops";

    const stopsList = document.createElement("ul");
    for (const stop of city.stops) {
        const item = document.createElement("li");
        item.textContent = Array.isArray(stop) ? stop.join(" - ") : stop;
        stopsList.appendChild(item);
    }

    cityDetails.append(heading, description, stayLength, stopsHeading, stopsList);
}

function cityIdForName(name) {
    const normalize = value => value.toLowerCase().replace(/[^a-z0-9]/g, "");
    const normalizedName = normalize(name);

    return Object.entries(cities).find(([id, city]) =>
        normalize(id) === normalizedName || normalize(city.name) === normalizedName
    )?.[0];
}

function refreshRecommendedEdgeMarkers() {
    recommendedEdgeMarkers.clearLayers();
    if (offscreenRecommendedCityIds.size === 0) {
        return;
    }

    const bounds = cityMap.getBounds();
    const size = cityMap.getSize();
    if (size.x === 0 || size.y === 0) {
        return;
    }

    const center = L.point(size.x / 2, size.y / 2);
    const horizontalInset = 66;
    const verticalInset = 18;
    const placedPositions = [];

    for (const cityId of offscreenRecommendedCityIds) {
        const city = cities[cityId];
        if (bounds.contains(city.coordinates)) {
            continue;
        }

        const point = cityMap.latLngToContainerPoint(city.coordinates);
        const deltaX = point.x - center.x;
        const deltaY = point.y - center.y;
        const scaleX = deltaX > 0
            ? (size.x - horizontalInset - center.x) / deltaX
            : deltaX < 0
                ? (horizontalInset - center.x) / deltaX
                : Infinity;
        const scaleY = deltaY > 0
            ? (size.y - verticalInset - center.y) / deltaY
            : deltaY < 0
                ? (verticalInset - center.y) / deltaY
                : Infinity;
        const scale = Math.min(scaleX, scaleY);
        const edgeX = center.x + deltaX * scale;
        let edgeY = center.y + deltaY * scale;

        for (let attempt = 0; attempt < Math.ceil(size.y / 30); attempt++) {
            const overlaps = placedPositions.some(position =>
                Math.abs(position.x - edgeX) < 118 && Math.abs(position.y - edgeY) < 28
            );
            if (!overlaps) {
                break;
            }
            edgeY += 30;
            if (edgeY > size.y - verticalInset) {
                edgeY = verticalInset;
            }
        }
        placedPositions.push({ x: edgeX, y: edgeY });

        const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI + 90;
        const label = document.createElement("div");
        label.className = "recommended-edge-label";

        const arrow = document.createElement("span");
        arrow.className = "recommended-edge-arrow";
        arrow.textContent = "▲";
        arrow.style.transform = `rotate(${angle}deg)`;

        const name = document.createElement("span");
        name.className = "recommended-edge-name";
        name.textContent = city.name;

        label.append(arrow, name);
        const icon = L.divIcon({
            className: "recommended-edge-icon",
            html: label,
            iconSize: [120, 26],
            iconAnchor: [60, 13]
        });
        L.marker(cityMap.containerPointToLatLng([edgeX, edgeY]), {
            icon,
            keyboard: false,
            zIndexOffset: 1000
        }).addTo(recommendedEdgeMarkers).bindTooltip(city.name);
    }
}

cityMap.on("moveend zoomend resize", refreshRecommendedEdgeMarkers);

function updateCityMap(preferredCityId, resetToAllCities = false, keepCurrentView = false) {
    const selectedCityId = cityList.querySelector("input:checked")?.value;
    const selected = new Set(selectedCityId ? [selectedCityId] : []);
    const routeCityIds = new Set(routeVisits.map(visit => visit.cityId));

    const activeCityId = selected.has(preferredCityId)
        ? preferredCityId
        : selectedCityId || routeVisits.at(-1)?.cityId;
    const recommendedCityIds = new Set(
        (cities[activeCityId]?.recommendedNext || [])
            .map(([name]) => cityIdForName(name))
            .filter(Boolean)
    );
    const offscreenRecommendations = new Set();

    for (const [id, marker] of Object.entries(cityMarkers)) {
        const isSelected = selected.has(id) || routeCityIds.has(id);
        const isRecommended = !isSelected && recommendedCityIds.has(id);
        if (isRecommended) {
            offscreenRecommendations.add(id);
        }
        marker.setStyle({
            radius: isSelected ? 10 : isRecommended ? 8 : 6,
            fillColor: isSelected ? "#147a4b" : isRecommended ? "#d97706" : "#858b88",
            fillOpacity: isSelected || isRecommended ? 1 : 0.55
        });
    }

    offscreenRecommendedCityIds = offscreenRecommendations;
    updateCityDetails(activeCityId);
    refreshRecommendedEdgeMarkers();

    if (keepCurrentView) {
        return;
    }

    const selectedCoordinates = [...selected]
        .map(id => cities[id].coordinates);

    if (resetToAllCities || selectedCoordinates.length === 0) {
        cityMap.fitBounds(allCityBounds);
    } else if (selectedCoordinates.length === 1) {
        cityMap.setView(selectedCoordinates[0], 6);
    } else {
        cityMap.fitBounds(L.latLngBounds(selectedCoordinates).pad(0.2), {
            maxZoom: 6
        });
    }
}

for (const [id, city] of Object.entries(cities)) {

    const wrapper = document.createElement("div");

    wrapper.className = "city-option";

    wrapper.innerHTML = `
        <input type="radio" name="city-destination" id="city-${id}" value="${id}">
        <label for="city-${id}">
            <span class="city-name">${city.name}</span>
            <span class="city-region">${city.region}</span>
        </label>
    `;

    cityList.appendChild(wrapper);
}

cityList.addEventListener("change", event => {
    updateCityMap(event.target.value);
    updateAddDestinationButton();
});

cityList.addEventListener("pointerdown", event => {
    const radio = event.target.closest(".city-option")
        ?.querySelector('input[type="radio"]');
    citySelectedBeforeActivation = radio?.checked ? radio.value : null;
});

cityList.addEventListener("keydown", event => {
    if (event.key !== " " && event.code !== "Space") {
        return;
    }

    const radio = event.target.closest('input[type="radio"]');
    citySelectedBeforeActivation = radio?.checked ? radio.value : null;
});

cityList.addEventListener("click", event => {
    const radio = event.target.closest(".city-option")
        ?.querySelector('input[type="radio"]');
    if (!radio || radio.value !== citySelectedBeforeActivation) {
        citySelectedBeforeActivation = null;
        return;
    }

    const deselectedCityId = radio.value;
    window.setTimeout(() => {
        if (citySelectedBeforeActivation !== deselectedCityId) {
            return;
        }

        radio.checked = false;
        citySelectedBeforeActivation = null;
        updateCityMap(undefined, true);
        updateAddDestinationButton();
    }, 0);
});

addDestinationButton.addEventListener("click", () => {
    const selectedCityId = cityList.querySelector("input:checked")?.value;
    if (!selectedCityId || routeVisits.at(-1)?.cityId === selectedCityId) {
        return;
    }
    if (routeVisits.length >= Number(daysSelect.value)) {
        return;
    }

    routeVisits.push(createRouteVisit(selectedCityId));
    normalizeRouteVisits();
    renderRouteSlots();
    updateCityMap(selectedCityId);
});

resetRouteButton.addEventListener("click", () => {
    routeVisits = [];
    citySelectedBeforeActivation = null;
    for (const visitId of Object.keys(stayDaysByVisit)) {
        delete stayDaysByVisit[visitId];
    }
    for (const radio of cityList.querySelectorAll('input[type="radio"]')) {
        radio.checked = false;
    }

    renderRouteSlots();
    updateCityMap(undefined, true);
});

updateCityMap(undefined, false, true);
renderRouteSlots();


/*
Create interest checkboxes.
*/

const interestList = document.getElementById("interest-list");

for (const [id, name] of Object.entries(interests)) {

    const label = document.createElement("label");

    label.className = "interest";

    label.innerHTML = `
        <input type="checkbox" value="${id}">
        ${name}
    `;

    interestList.appendChild(label);
}


/*
Select recommended cities.
*/

document.getElementById("recommended").addEventListener("click", () => {
    const sourceCityId = routeVisits[0]?.cityId;
    if (!sourceCityId) {
        return;
    }

    const recommended = recommendations[sourceCityId] || [];
    const selectedCityIds = new Set([sourceCityId, ...recommended]);

    document
        .querySelectorAll("#city-list input")
        .forEach(input => {
            input.checked = selectedCityIds.has(input.value);
        });

    routeVisits = [sourceCityId, ...recommended]
        .filter((cityId, index, cityIds) => cityIds.indexOf(cityId) === index)
        .map(createRouteVisit);
    renderRouteSlots();
    updateCityMap();

});


/*
Build the itinerary.
*/

document.getElementById("build").addEventListener("click", () => {
    const numberOfDays =
        Number(document.getElementById("days").value);

    const selectedCities =
        [...new Set(routeVisits.map(visit => visit.cityId))];

    const selectedInterests =
        [...document.querySelectorAll("#interest-list input:checked")]
            .map(input => input.value);

    const error =
        document.getElementById("error");


    if (selectedCities.length === 0) {

        error.textContent =
            "Please select at least one destination.";

        return;

    }

    error.textContent = "";


    /*
    Display itinerary.
    */

    const container =
        document.getElementById("days-container");

    container.innerHTML = "";


    itinerary.forEach((city, index) => {

        const day =
            document.createElement("div");

        day.className = "day";


        const stops =
            city.stops
                .map((stop, stopIndex) => {

                    return `
                        <div class="stop">

                            <div class="stop-number">
                                ${stopIndex + 1}
                            </div>

                            <div class="stop-content">

                                <strong>
                                    ${stop[0]}
                                </strong>

                                <span class="time">
                                    ${stop[1]}
                                </span>

                            </div>

                        </div>
                    `;

                })
                .join("");


        /*
        Add a simple travel indication
        between different cities.
        */

        let travel = "";

        if (index > 0 &&
            itinerary[index - 1].name !== city.name) {

            travel = `
                <div class="travel">
                    🚆 Travel from
                    ${itinerary[index - 1].name}
                    to ${city.name}
                </div>
            `;

        }


        day.innerHTML = `

            <div class="day-header">

                <div>

                    <div class="day-number">
                        Day ${index + 1}
                    </div>

                    <h3 class="day-title">
                        ${city.name}
                    </h3>

                </div>

                <div class="region">
                    ${city.region}
                </div>

            </div>

            ${travel}

            <div class="day-description">
                ${city.description}
            </div>

            ${stops}

        `;


        container.appendChild(day);

    });


    /*
    Update summary.
    */

    document.getElementById("itinerary-title")
        .textContent =
            `${numberOfDays}-Day European Adventure`;

    document.getElementById("itinerary-summary")
        .textContent =
            `${selectedCities.length} destinations selected`;


    document.getElementById("itinerary")
        .style.display = "block";


    /*
    Scroll down to itinerary.
    */

    document.getElementById("itinerary")
        .scrollIntoView({
            behavior: "smooth"
        });

});


/*
Automatically select recommended destinations
when the page first loads.
*/

document.getElementById("recommended").click();

</script>
